/* Layout: three scroll-pinned anime chapters (canvas scene + manga panels), then a cream "party stats" sheet and an ink footer */
:root{
  --bg:#efe2c2; --paper:#f8eed6; --ink:#2a180e; --accent:#e0b552; --scarlet:#8e1b20; --scarlet-hi:#b8282e; --night:#140a10;
  --ocean:#b8282e; --ocean-deep:#7f1218;
  --white:#fbf3df; --z400:#c7b48e; --z500:#7a6244; --z600:#5b4630;
  --magic:"HarryP","Noto Sans Thai",Georgia,serif;
  --sans:"EB Garamond","Noto Sans Thai",Georgia,serif;
  --mono:"Cinzel","Noto Sans Thai",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
body::after{content:"";position:fixed;inset:0;z-index:55;pointer-events:none;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);text-transform:uppercase}
.t-title{font-family:var(--magic);font-style:normal;font-weight:400;letter-spacing:.01em;line-height:.92}
.accent{color:var(--accent)}
#systems .accent{color:var(--scarlet)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* header */
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:40;border-bottom:1px solid transparent;transition:background-color .3s,border-color .3s}
.top.solid{background:#140a10e6;backdrop-filter:blur(10px);border-color:#e0b55244}
.top .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;text-decoration:none;color:#fff;text-shadow:0 1px 2px #0009}
.brand .dot{width:8px;height:8px;box-shadow:0 0 12px #e0b552e6}
.top nav{display:flex;gap:32px;align-items:center}
.top nav a{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#d4d4d8;text-shadow:0 1px 2px #0008}
.top nav a:hover{color:#fff}
.sample-chip{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:#e0b552;border:1px solid #f6dc95;border-radius:999px;padding:3px 8px;text-shadow:none}
@media (max-width:760px){.top nav a{display:none}}

/* pinned chapters */
.pin{position:relative;background:var(--night)}
.pin + .pin{border-top:1px solid #ffffff0d}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--night)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none}
.lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,#e0b5520f 0 1px,transparent 1px 64px);-webkit-mask-image:linear-gradient(#000,transparent 42%);mask-image:linear-gradient(#000,transparent 42%)}
.hud{position:absolute;z-index:10;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#e4e4e7;text-shadow:0 1px 3px #000a;pointer-events:none}
.hud.tl{left:24px;top:84px}.hud.tr{right:24px;top:84px}
.hud.tl::before{content:"✦";width:auto;height:auto;background:none;color:var(--accent);letter-spacing:0}
.hud .accent{letter-spacing:.22em}
@media (min-width:768px){.hud.tl{left:40px;top:96px}.hud.tr{right:40px;top:96px}}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.foot .bar{margin:0 24px 12px;height:1px;background:#e0b55233}
.foot .bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.foot .row{margin:0 24px;padding-bottom:16px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#c9c9cf;text-shadow:0 1px 3px #000a;font-variant-numeric:tabular-nums}
@media (min-width:768px){.foot .bar,.foot .row{margin-left:40px;margin-right:40px}}
@media (max-width:520px){.foot .row span:nth-child(2){display:none}}

.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--accent);background:linear-gradient(#9b1c22,#6d1217);color:#f6dc95;border-radius:3px;padding:6px 14px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 0 3px #6d121788,0 6px 18px #0007}
.badge .dot{background:var(--accent);box-shadow:0 0 8px #e0b552}

/* hero copy */
.intro{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:flex-start;gap:20px;padding:0 24px 96px;transition:opacity .25s}
.intro h1{margin:0;max-width:16ch;font-size:clamp(56px,10.5vw,124px);line-height:.95;color:#fbf3df;text-shadow:0 3px 0 #2a180e99,0 0 30px #e0b55244,0 6px 24px #0007}
.intro p{margin:0;max-width:42ch;font-size:18px;line-height:1.6;color:#e4e4e7;text-shadow:0 1px 3px #000c}
.build{position:absolute;left:24px;bottom:96px;z-index:10;max-width:62%;display:flex;flex-direction:column;gap:20px;opacity:0;transition:opacity .25s;pointer-events:none}
.build .k{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);text-shadow:0 1px 3px #000a}
.build h2{margin:0;font-size:clamp(70px,12vw,176px);line-height:.88;color:#fff;text-shadow:0 4px 0 #1d355799,0 8px 30px #0008;font-weight:400}
.build p{margin:0;max-width:36ch;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e4e4e7;text-shadow:0 1px 3px #000c}
@media (min-width:768px){.intro{padding:0 48px 112px}.build{left:48px;bottom:112px}}
@media (max-width:767px){.build{display:none}}

/* chapter heads (skills / treasure) */
.chead{position:absolute;right:24px;top:112px;z-index:10;max-width:46ch;display:flex;flex-direction:column;align-items:flex-end;gap:20px;text-align:right;pointer-events:none}
.chead .badge{align-self:flex-end}
.chead .tt{position:relative;align-self:stretch}
.chead h2{margin:0;font-size:clamp(46px,7.5vw,92px);line-height:.98;color:#fff;text-shadow:0 3px 0 #1d355799,0 6px 24px #0008;transition:opacity .24s}
.chead h2 + h2{position:absolute;inset:0;opacity:0}
.chead p{margin:0;max-width:42ch;font-size:18px;line-height:1.6;color:#e4e4e7;text-shadow:0 1px 3px #000c}
@media (min-width:768px){.chead{right:48px;top:128px}}
@media (max-width:767px){.chead{left:24px;top:110px;align-items:flex-start;text-align:left}.chead .badge{align-self:flex-start}.chead h2{font-size:44px}.chead p{font-size:13px}}

/* manga panels */
.panels{position:absolute;z-index:20;display:flex;flex-direction:column;gap:18px;width:min(440px,calc(100% - 48px))}
.panels.right{right:24px;top:20%}
.panels.left{left:24px;top:15%}
@media (min-width:768px){.panels.right{right:48px}.panels.left{left:48px}}
.panel{position:relative;background:linear-gradient(160deg,#f8eed6,#e9d6a8);border:1px solid #8a6a3a;border-radius:4px;box-shadow:inset 0 0 0 4px #f8eed6,inset 0 0 0 5px #b08a4a,inset 0 0 40px #b08a4a40,0 14px 30px -8px #000c,0 0 0 1px #e0b55255;padding:22px 24px;color:var(--ink);opacity:0;transform:translateY(20px);transition:opacity .4s ease-out,transform .4s ease-out}
.panel.on{opacity:1;transform:none}
.panel[hidden]{display:none}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 15% 10%,#ffffff55,transparent 40%),radial-gradient(circle at 90% 100%,#8a6a3a22,transparent 50%)}
.panel.bubble::after{content:"";position:absolute;bottom:-14px;left:34px;width:0;height:0;border-left:14px solid transparent;border-right:6px solid transparent;border-top:14px solid #b08a4a}
.chip{display:inline-flex;align-items:center;background:var(--scarlet);color:#f6dc95;border-radius:2px;padding:3px 9px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 0 1px #e0b55288}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.panel .rank{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7a5410}
.panel .rank.loot{color:var(--scarlet)}
.panel .big{display:flex;align-items:baseline;gap:16px;margin-top:10px;position:relative;flex-wrap:wrap}
.panel .big b{font-size:54px;line-height:1;color:var(--scarlet);font-variant-numeric:tabular-nums}
.panel .big span{font-size:19px;font-weight:600;letter-spacing:-.02em}
.panel .sub{position:relative;margin:10px 0 0;font-family:var(--sans);font-style:italic;font-size:15px;letter-spacing:.01em;color:var(--z500);line-height:1.5}
.panel .lvrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px;position:relative}
.panel .lvrow .n{font-size:28px}
.panel .lvrow .lv{font-size:28px;color:var(--scarlet);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{position:relative;margin-top:12px;height:10px;border:1px solid #8a6a3a;background:#2a180e1a;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px #0003}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#9b1c22,#d6a84e 70%,#f6dc95);border-radius:999px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.panel.on .meter i{transform:scaleX(var(--lv))}
.panel .op{display:block;margin-top:10px;font-size:28px;position:relative}
.panel .desc{position:relative;margin:8px 0 0;font-size:17px;line-height:1.5;color:var(--z600)}
@media (max-width:767px){
  .panels{left:24px!important;right:24px!important;width:auto;top:auto!important;bottom:84px;display:grid;gap:0}
  .panels .panel{grid-area:1/1;padding:16px 18px}
  .panels .panel.on{opacity:0;transform:translateY(16px)}
  .panels .panel.cur{opacity:1;transform:none}
  .panel.bubble::after{display:none}
  .panel .big b{font-size:32px}.panel .big span{font-size:16px}
  .hud.tl{display:none}
  .pin.hero .intro{bottom:auto;top:120px;padding-bottom:0}
  .pin.hero .intro h1{font-size:56px}
  .pin.hero .intro p{font-size:13px}
}

/* loading overlay */
.loader{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 40%,#2a1220,#0c060a 70%);padding:0 24px;transition:opacity .5s}
.loader.gone{opacity:0;pointer-events:none}
.loader .badge{align-self:center}
.loader .track{width:240px;height:4px;border-radius:999px;background:#e0b55233}
.loader .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b1c22,#e0b552);transition:width .15s ease-out}
.loader p{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c7b48e}
.loader .nine{font-family:var(--magic);font-size:64px;line-height:1;color:var(--accent);text-shadow:0 0 24px #e0b55266}

/* systems */
#systems{position:relative;background:radial-gradient(circle at 20% 10%,#f8eed6,transparent 50%),radial-gradient(circle at 90% 90%,#d9c08b,transparent 55%),var(--bg);color:var(--ink);border-top:6px double var(--accent);padding-block:96px 112px;overflow:hidden}
.halftone{position:absolute;pointer-events:none;background-image:repeating-radial-gradient(circle,#8a6a3a33 0 1px,transparent 1px 14px);-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));position:relative}
.sys{display:grid;grid-template-columns:5fr 4fr;gap:80px}
@media (max-width:900px){.sys{grid-template-columns:1fr;gap:56px}}
.sys .l{display:flex;flex-direction:column;gap:32px;min-width:0}
.sys h2{margin:0;max-width:18ch;font-size:clamp(44px,6.6vw,76px);line-height:.98}
.sys p.lead{margin:0;max-width:48ch;font-size:20px;line-height:1.65;color:var(--z600)}
.clients{display:flex;flex-direction:column;gap:16px}
.clients .k{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--z600)}
.logos{display:flex;flex-wrap:wrap;gap:14px}
.logo{width:120px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;border:1px solid #8a6a3a66;border-radius:4px;background:#f8eed6;padding:12px 10px;box-shadow:inset 0 0 0 3px #f8eed6,inset 0 0 0 4px #b08a4a55}
.logo .mk{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d8484d,#8e161b 60%,#5e0d10);color:#f6c9a8;font-family:var(--magic);font-size:22px;box-shadow:0 3px 6px #0005,inset 0 -3px 6px #0006;transform:rotate(-6deg)}
.logo:nth-child(3n+2) .mk{background:radial-gradient(circle at 35% 30%,#f0cf73,#b88a1c 60%,#7a5410);color:#3b2412}

 var head='<title>'+esc(document.title||'Voyage Portfolio')+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+esc(fonts?fonts.getAttribute('href'):'')+'">\n';
 return SKELETON_HEAD+head+'<style id="css">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="portfolio-data">'+json+SC+'\n<script id="main">'+main+SC+'\n\n</body></html>';
}

function embedImage(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var max=1400,k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);var out=cv.toDataURL('image/webp',0.85);if(out.indexOf('data:image/webp')!==0)out=cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.86);res(out)};im.src=fr.result};fr.readAsDataURL(file)})}
function startEditor(artifact,assets){
 var draft=null,tab=0,drawer=null,timer=null,saving=false;
 var fab=document.createElement('button');fab.type='button';fab.className='fab';fab.textContent='✎ Edit portfolio';document.body.appendChild(fab);
 fab.addEventListener('click',open);
 function open(){
  draft=JSON.parse(JSON.stringify(DATA));
  try{var st=sessionStorage.getItem('vp-draft');if(st&&st!==JSON.stringify(DATA))draft._restorable=JSON.parse(st)}catch(e){}
  fab.hidden=true;drawer=document.createElement('aside');drawer.className='drawer';drawer.setAttribute('aria-label','Edit portfolio');document.body.appendChild(drawer);draw();
 }
 function close(){drawer.remove();drawer=null;draft=null;view=DATA;render(view);fab.hidden=false}
 function clean(d){var c=JSON.parse(JSON.stringify(d));delete c._restorable;return c}
 function preview(){clearTimeout(timer);timer=setTimeout(function(){var y=scrollY;view=clean(draft);render(view);scrollTo(0,y)},200)}
 function field(base,f){
  var path=join(base,f[0]),val=getP(draft,path),h='<label class="f"><span>'+esc(f[2])+'</span>';
  if(f[1]==='area')return h+'<textarea data-path="'+path+'" rows="3">'+esc(val)+'</textarea></label>';
  if(f[1]==='photo'){
   h='<div class="f"><span>'+esc(f[2])+'</span><div class="ph"><div class="th">'+(val?'<img src="'+esc(photoSrc(val))+'" alt="">':esc(initials(draft)))+'</div>';
   h+='<label class="btn">Upload photo<input type="file" accept="image/png,image/jpeg,image/webp" data-photo="'+path+'" hidden></label>'+(val?'<button type="button" class="btn" data-photo-clear="'+path+'">Remove</button>':'');
   return h+'</div></div>';
  }
  return h+'<input type="text" data-path="'+path+'" value="'+esc(val)+'"></label>';
 }
 function draw(){
  var T=SCHEMA[tab],h='<header><h2 class="t-title">Edit the voyage</h2><button type="button" class="ib" data-close aria-label="Close">✕</button></header><div class="tabs" role="tablist">';
  SCHEMA.forEach(function(s,i){h+='<button type="button" role="tab" data-tab="'+i+'" aria-selected="'+(i===tab)+'">'+esc(s.tab)+'</button>'});
  h+='</div><div class="ed">';
  if(draft._restorable)h+='<div class="box"><p class="help">พบฉบับร่างที่ยังไม่ได้บันทึกจากครั้งก่อน</p><div><button type="button" class="btn" data-restore>Restore draft</button></div></div>';
  T.groups.forEach(function(g,gi){
   if(g.help)h+='<p class="help">'+esc(g.help)+'</p>';
   if(!g.list){h+='<div class="box">';g.fields.forEach(function(f){h+=field(g.path,f)});h+='</div>';return}
   var L=getP(draft,g.path)||[];
   L.forEach(function(it,i){var nm=it.title||it.name||it.label||it.value||'';
    h+='<div class="box"><div class="boxbar"><strong>'+esc(g.item)+' '+(i+1)+(nm?' · '+esc(nm):'')+'</strong><button type="button" class="ib" data-mv="'+gi+':'+i+':-1" aria-label="Move up"'+(i?'':' disabled')+'>↑</button><button type="button" class="ib" data-mv="'+gi+':'+i+':1" aria-label="Move down"'+(i<L.length-1?'':' disabled')+'>↓</button><button type="button" class="ib" data-del="'+gi+':'+i+'" aria-label="Delete">✕</button></div>';
    g.fields.forEach(function(f){h+=field(g.path+'.'+i,f)});h+='</div>'});
   h+='<div><button type="button" class="btn" data-add="'+gi+'">+ Add '+esc(g.item)+'</button></div>';
  });
  h+='</div><footer><span class="grow" data-status>หน้าเว็บด้านหลังเปลี่ยนตามทันที กด Save เพื่อให้ทุกคนเห็น</span><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn go" data-save>Save</button></footer>';
  drawer.innerHTML=h;
 }
 document.addEventListener('input',function(e){if(!drawer||!drawer.contains(e.target))return;var p=e.target.getAttribute('data-path');if(p){setP(draft,p,e.target.value);preview()}});
 document.addEventListener('change',function(e){
  if(!drawer||!drawer.contains(e.target)||!e.target.matches('[data-photo]')||!e.target.files[0])return;
  var f=e.target.files[0],st=drawer.querySelector('[data-status]');
  if(f.size>8*1024*1024){st.textContent='รูปใหญ่เกิน 8MB กรุณาย่อรูปก่อน';return}
  st.textContent='กำลังอัปโหลดรูป...';
  var pth=e.target.getAttribute('data-photo');embedImage(f).then(function(url){setP(draft,pth,url);st.textContent='ใส่รูปแล้ว รูปฝังอยู่ในหน้าเว็บ (export ได้)';draw();preview()},function(){st.textContent='อ่านไฟล์รูปไม่สำเร็จ ลองใช้ไฟล์ PNG, JPG หรือ WebP'});
 });
 document.addEventListener('click',function(e){
  if(!drawer||!drawer.contains(e.target))return;var b=e.target.closest('button');if(!b)return;var G=SCHEMA[tab].groups;
  if(b.hasAttribute('data-close')||b.hasAttribute('data-cancel'))return close();
  if(b.hasAttribute('data-tab')){tab=+b.getAttribute('data-tab');draw();return}
  if(b.hasAttribute('data-restore')){draft=draft._restorable;draw();preview();return}
  if(b.hasAttribute('data-photo-clear')){setP(draft,b.getAttribute('data-photo-clear'),'');draw();preview();return}
  if(b.hasAttribute('data-add')){var g=G[+b.getAttribute('data-add')],L=getP(draft,g.path);if(!L){L=[];setP(draft,g.path,L)}L.push(JSON.parse(JSON.stringify(g.blank)));draw();preview();var ed=drawer.querySelector('.ed');ed.scrollTop=ed.scrollHeight;return}
  if(b.hasAttribute('data-del')){var q=b.getAttribute('data-del').split(':');
   if(b.getAttribute('data-sure')){getP(draft,G[+q[0]].path).splice(+q[1],1);draw();preview()}else{b.setAttribute('data-sure','1');b.textContent='?';b.style.borderColor='var(--accent)';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-sure');b.textContent='✕';b.style.borderColor=''}},2500)}return}
  if(b.hasAttribute('data-mv')){var m=b.getAttribute('data-mv').split(':'),A=getP(draft,G[+m[0]].path),i=+m[1],j=i+(+m[2]);if(j<0||j>=A.length)return;var tmp=A[i];A[i]=A[j];A[j]=tmp;draw();preview();return}
  if(b.hasAttribute('data-save'))save(b);
 });
 function save(btn){
  if(saving)return;saving=true;btn.disabled=true;var st=drawer.querySelector('[data-status]');st.textContent='กำลังบันทึก...';
  var next=clean(draft);next.sample=false;
  try{sessionStorage.setItem('vp-draft',JSON.stringify(next))}catch(e){}
  artifact.publish(buildDoc(next)).then(function(){try{sessionStorage.removeItem('vp-draft')}catch(e){}st.textContent='บันทึกแล้ว'},function(err){
   saving=false;btn.disabled=false;var c=err&&err.code;
   st.textContent=c==='conflict'?'มีเวอร์ชันใหม่กว่าถูกบันทึกไปก่อน หน้าจะโหลดใหม่ ฉบับร่างถูกเก็บไว้ให้กู้คืน':(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled')?'บัญชีนี้ไม่มีสิทธิ์บันทึกหน้านี้':c==='too_large'?'ข้อมูลใหญ่เกินไป':c==='rate_limited'?'บันทึกถี่เกินไป รอสักครู่':'บันทึกไม่สำเร็จ ลองอีกครั้ง';
  });
 }
}
(async function(){
 try{
  if(!window.claude||!window.claude.use)return;
  var user=await window.claude.use('user');if(!user||!(await user.canEdit()))return;
  var artifact=await window.claude.use('artifact');if(!artifact)return;
  var assets=null;try{assets=await window.claude.use('assets')}catch(e){}
  try{if(sessionStorage.getItem('vp-draft')===JSON.stringify(DATA))sessionStorage.removeItem('vp-draft')}catch(e){}
  startEditor(artifact,assets);
 }catch(e){}
})();
})();
</script>

/* Layout: three scroll-pinned anime chapters (canvas scene + manga panels), then a cream "party stats" sheet and an ink footer */
:root{
  --bg:#efe2c2; --paper:#f8eed6; --ink:#2a180e; --accent:#e0b552; --scarlet:#8e1b20; --scarlet-hi:#b8282e; --night:#140a10;
  --ocean:#b8282e; --ocean-deep:#7f1218;
  --white:#fbf3df; --z400:#c7b48e; --z500:#7a6244; --z600:#5b4630;
  --magic:"HarryP","Noto Sans Thai",Georgia,serif;
  --sans:"EB Garamond","Noto Sans Thai",Georgia,serif;
  --mono:"Cinzel","Noto Sans Thai",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
body::after{content:"";position:fixed;inset:0;z-index:55;pointer-events:none;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);text-transform:uppercase}
.t-title{font-family:var(--magic);font-style:normal;font-weight:400;letter-spacing:.01em;line-height:.92}
.accent{color:var(--accent)}
#systems .accent{color:var(--scarlet)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* header */
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:40;border-bottom:1px solid transparent;transition:background-color .3s,border-color .3s}
.top.solid{background:#140a10e6;backdrop-filter:blur(10px);border-color:#e0b55244}
.top .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;text-decoration:none;color:#fff;text-shadow:0 1px 2px #0009}
.brand .dot{width:8px;height:8px;box-shadow:0 0 12px #e0b552e6}
.top nav{display:flex;gap:32px;align-items:center}
.top nav a{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#d4d4d8;text-shadow:0 1px 2px #0008}
.top nav a:hover{color:#fff}
.sample-chip{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:#e0b552;border:1px solid #f6dc95;border-radius:999px;padding:3px 8px;text-shadow:none}
@media (max-width:760px){.top nav a{display:none}}

/* pinned chapters */
.pin{position:relative;background:var(--night)}
.pin + .pin{border-top:1px solid #ffffff0d}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--night)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none}
.lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,#e0b5520f 0 1px,transparent 1px 64px);-webkit-mask-image:linear-gradient(#000,transparent 42%);mask-image:linear-gradient(#000,transparent 42%)}
.hud{position:absolute;z-index:10;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#e4e4e7;text-shadow:0 1px 3px #000a;pointer-events:none}
.hud.tl{left:24px;top:84px}.hud.tr{right:24px;top:84px}
.hud.tl::before{content:"✦";width:auto;height:auto;background:none;color:var(--accent);letter-spacing:0}
.hud .accent{letter-spacing:.22em}
@media (min-width:768px){.hud.tl{left:40px;top:96px}.hud.tr{right:40px;top:96px}}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.foot .bar{margin:0 24px 12px;height:1px;background:#e0b55233}
.foot .bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.foot .row{margin:0 24px;padding-bottom:16px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#c9c9cf;text-shadow:0 1px 3px #000a;font-variant-numeric:tabular-nums}
@media (min-width:768px){.foot .bar,.foot .row{margin-left:40px;margin-right:40px}}
@media (max-width:520px){.foot .row span:nth-child(2){display:none}}

.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--accent);background:linear-gradient(#9b1c22,#6d1217);color:#f6dc95;border-radius:3px;padding:6px 14px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 0 3px #6d121788,0 6px 18px #0007}
.badge .dot{background:var(--accent);box-shadow:0 0 8px #e0b552}

/* hero copy */
.intro{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:flex-start;gap:20px;padding:0 24px 96px;transition:opacity .25s}
.intro h1{margin:0;max-width:16ch;font-size:clamp(56px,10.5vw,124px);line-height:.95;color:#fbf3df;text-shadow:0 3px 0 #2a180e99,0 0 30px #e0b55244,0 6px 24px #0007}
.intro p{margin:0;max-width:42ch;font-size:18px;line-height:1.6;color:#e4e4e7;text-shadow:0 1px 3px #000c}
.build{position:absolute;left:24px;bottom:96px;z-index:10;max-width:62%;display:flex;flex-direction:column;gap:20px;opacity:0;transition:opacity .25s;pointer-events:none}
.build .k{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);text-shadow:0 1px 3px #000a}
.build h2{margin:0;font-size:clamp(70px,12vw,176px);line-height:.88;color:#fff;text-shadow:0 4px 0 #1d355799,0 8px 30px #0008;font-weight:400}
.build p{margin:0;max-width:36ch;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e4e4e7;text-shadow:0 1px 3px #000c}
@media (min-width:768px){.intro{padding:0 48px 112px}.build{left:48px;bottom:112px}}
@media (max-width:767px){.build{display:none}}

/* chapter heads (skills / treasure) */
.chead{position:absolute;right:24px;top:112px;z-index:10;max-width:46ch;display:flex;flex-direction:column;align-items:flex-end;gap:20px;text-align:right;pointer-events:none}
.chead .badge{align-self:flex-end}
.chead .tt{position:relative;align-self:stretch}
.chead h2{margin:0;font-size:clamp(46px,7.5vw,92px);line-height:.98;color:#fff;text-shadow:0 3px 0 #1d355799,0 6px 24px #0008;transition:opacity .24s}
.chead h2 + h2{position:absolute;inset:0;opacity:0}
.chead p{margin:0;max-width:42ch;font-size:18px;line-height:1.6;color:#e4e4e7;text-shadow:0 1px 3px #000c}
@media (min-width:768px){.chead{right:48px;top:128px}}
@media (max-width:767px){.chead{left:24px;top:110px;align-items:flex-start;text-align:left}.chead .badge{align-self:flex-start}.chead h2{font-size:44px}.chead p{font-size:13px}}

/* manga panels */
.panels{position:absolute;z-index:20;display:flex;flex-direction:column;gap:18px;width:min(440px,calc(100% - 48px))}
.panels.right{right:24px;top:20%}
.panels.left{left:24px;top:15%}
@media (min-width:768px){.panels.right{right:48px}.panels.left{left:48px}}
.panel{position:relative;background:linear-gradient(160deg,#f8eed6,#e9d6a8);border:1px solid #8a6a3a;border-radius:4px;box-shadow:inset 0 0 0 4px #f8eed6,inset 0 0 0 5px #b08a4a,inset 0 0 40px #b08a4a40,0 14px 30px -8px #000c,0 0 0 1px #e0b55255;padding:22px 24px;color:var(--ink);opacity:0;transform:translateY(20px);transition:opacity .4s ease-out,transform .4s ease-out}
.panel.on{opacity:1;transform:none}
.panel[hidden]{display:none}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 15% 10%,#ffffff55,transparent 40%),radial-gradient(circle at 90% 100%,#8a6a3a22,transparent 50%)}
.panel.bubble::after{content:"";position:absolute;bottom:-14px;left:34px;width:0;height:0;border-left:14px solid transparent;border-right:6px solid transparent;border-top:14px solid #b08a4a}
.chip{display:inline-flex;align-items:center;background:var(--scarlet);color:#f6dc95;border-radius:2px;padding:3px 9px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 0 1px #e0b55288}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.panel .rank{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7a5410}
.panel .rank.loot{color:var(--scarlet)}
.panel .big{display:flex;align-items:baseline;gap:16px;margin-top:10px;position:relative;flex-wrap:wrap}
.panel .big b{font-size:54px;line-height:1;color:var(--scarlet);font-variant-numeric:tabular-nums}
.panel .big span{font-size:19px;font-weight:600;letter-spacing:-.02em}
.panel .sub{position:relative;margin:10px 0 0;font-family:var(--sans);font-style:italic;font-size:15px;letter-spacing:.01em;color:var(--z500);line-height:1.5}
.panel .lvrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px;position:relative}
.panel .lvrow .n{font-size:28px}
.panel .lvrow .lv{font-size:28px;color:var(--scarlet);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{position:relative;margin-top:12px;height:10px;border:1px solid #8a6a3a;background:#2a180e1a;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px #0003}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#9b1c22,#d6a84e 70%,#f6dc95);border-radius:999px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.panel.on .meter i{transform:scaleX(var(--lv))}
.panel .op{display:block;margin-top:10px;font-size:28px;position:relative}
.panel .desc{position:relative;margin:8px 0 0;font-size:17px;line-height:1.5;color:var(--z600)}
@media (max-width:767px){
  .panels{left:24px!important;right:24px!important;width:auto;top:auto!important;bottom:84px;display:grid;gap:0}
  .panels .panel{grid-area:1/1;padding:16px 18px}
  .panels .panel.on{opacity:0;transform:translateY(16px)}
  .panels .panel.cur{opacity:1;transform:none}
  .panel.bubble::after{display:none}
  .panel .big b{font-size:32px}.panel .big span{font-size:16px}
  .hud.tl{display:none}
  .pin.hero .intro{bottom:auto;top:120px;padding-bottom:0}
  .pin.hero .intro h1{font-size:56px}
  .pin.hero .intro p{font-size:13px}
}

/* loading overlay */
.loader{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 40%,#2a1220,#0c060a 70%);padding:0 24px;transition:opacity .5s}
.loader.gone{opacity:0;pointer-events:none}
.loader .badge{align-self:center}
.loader .track{width:240px;height:4px;border-radius:999px;background:#e0b55233}
.loader .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b1c22,#e0b552);transition:width .15s ease-out}
.loader p{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c7b48e}
.loader .nine{font-family:var(--magic);font-size:64px;line-height:1;color:var(--accent);text-shadow:0 0 24px #e0b55266}

/* systems */
#systems{position:relative;background:radial-gradient(circle at 20% 10%,#f8eed6,transparent 50%),radial-gradient(circle at 90% 90%,#d9c08b,transparent 55%),var(--bg);color:var(--ink);border-top:6px double var(--accent);padding-block:96px 112px;overflow:hidden}
.halftone{position:absolute;pointer-events:none;background-image:repeating-radial-gradient(circle,#8a6a3a33 0 1px,transparent 1px 14px);-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));position:relative}
.sys{display:grid;grid-template-columns:5fr 4fr;gap:80px}
@media (max-width:900px){.sys{grid-template-columns:1fr;gap:56px}}
.sys .l{display:flex;flex-direction:column;gap:32px;min-width:0}
.sys h2{margin:0;max-width:18ch;font-size:clamp(44px,6.6vw,76px);line-height:.98}
.sys p.lead{margin:0;max-width:48ch;font-size:20px;line-height:1.65;color:var(--z600)}
.clients{display:flex;flex-direction:column;gap:16px}
.clients .k{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--z600)}
.logos{display:flex;flex-wrap:wrap;gap:14px}
.logo{width:120px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;border:1px solid #8a6a3a66;border-radius:4px;background:#f8eed6;padding:12px 10px;box-shadow:inset 0 0 0 3px #f8eed6,inset 0 0 0 4px #b08a4a55}
.logo .mk{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d8484d,#8e161b 60%,#5e0d10);color:#f6c9a8;font-family:var(--magic);font-size:22px;box-shadow:0 3px 6px #0005,inset 0 -3px 6px #0006;transform:rotate(-6deg)}
.logo:nth-child(3n+2) .mk{background:radial-gradient(circle at 35% 30%,#f0cf73,#b88a1c 60%,#7a5410);color:#3b2412}
.logo:nth-child(3n) .mk{background:radial-gradient(circle at 35% 30%,#4a3a2a,#2a180e 70%);color:#e0b552}
.logo.img{width:150px;justify-content:flex-start;gap:10px}
.logo .lg{display:block;width:100%;aspect-ratio:16/10;border-radius:4px;overflow:hidden;box-shadow:0 2px 6px #2a180e44,inset 0 0 0 1px #0002}
.logo .lg img{width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.logo span{font-size:13px;line-height:1.25;text-align:center;color:var(--z600);overflow-wrap:anywhere}
.cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--accent);background:linear-gradient(#9b1c22,#6d1217);color:#f6dc95;border-radius:3px;padding:12px 22px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;box-shadow:0 0 0 3px #6d121755,4px 4px 0 var(--ink);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(1px);box-shadow:2px 2px 0 var(--ink)}
.ledger{border-top:2px solid #8a6a3a88;font-family:var(--mono);align-self:start}
.ledger .r{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding-block:20px;border-bottom:1px dashed #8a6a3a66}
.ledger .r .a{display:flex;flex-direction:column;gap:4px;min-width:0}
.ledger .r .a b{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.ledger .r .a span{font-size:15px;font-style:italic;color:var(--z500);font-family:var(--sans)}
.ledger .r .v{font-size:clamp(44px,5.6vw,68px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .r:nth-child(odd) .v{color:var(--scarlet)}

/* footer */
#footer{background:radial-gradient(circle at 50% 0,#2a1220,#0c060a 70%);color:#efe2c2;padding-block:72px 40px;border-top:1px solid #e0b55244}
.swear{margin:0 0 40px;text-align:center;font-style:italic;font-size:20px;color:#c7b48e}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.fgrid h3{margin:0 0 14px;font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fbrand{font-size:clamp(36px,4.2vw,52px);color:#fff;line-height:1}
.fnote{margin:14px 0 0;max-width:40ch;font-size:17px;line-height:1.6;color:#c7b48e}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:17px}
.flist b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#f6dc95;font-weight:600}
.flist span,.flist a{color:#c7b48e;text-decoration:none;overflow-wrap:anywhere}
.flist a:hover{color:#fff;text-decoration:underline}
.fbase{margin-top:56px;padding-top:20px;border-top:1px solid #e0b55233;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a08a66}

/* wand cursor + spell trail */
html.wand,html.wand body{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M5 5 L28 28' stroke='%231d1208' stroke-width='5' stroke-linecap='round'/><path d='M5 5 L28 28' stroke='%237a4a24' stroke-width='3' stroke-linecap='round'/><path d='M21 21 L28 28' stroke='%23d4a22f' stroke-width='3.4' stroke-linecap='round'/><circle cx='4' cy='4' r='3' fill='%23fff3c4'/></svg>") 3 3,auto}
html.wand a,html.wand button,html.wand .btn,html.wand [role=tab]{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M5 5 L28 28' stroke='%231d1208' stroke-width='5' stroke-linecap='round'/><path d='M5 5 L28 28' stroke='%237a4a24' stroke-width='3' stroke-linecap='round'/><path d='M21 21 L28 28' stroke='%23d4a22f' stroke-width='3.4' stroke-linecap='round'/><circle cx='4' cy='4' r='4.5' fill='%23ff5c2a'/><circle cx='4' cy='4' r='2' fill='%23fff3c4'/></svg>") 3 3,pointer}
html.wand input,html.wand textarea{cursor:text}
#magic{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* animated character (owner's full-body wizard) */
.avatar{position:absolute;z-index:4;top:4vh;bottom:0;right:4%;height:96%;aspect-ratio:1012/1536;max-width:none;pointer-events:none}
.avatar::before{content:"";position:absolute;left:-20%;right:-20%;top:5%;bottom:10%;background:radial-gradient(closest-side,#2bff6a2e,#2bff6a10 55%,transparent);opacity:calc(.6 + var(--charge,0) * .8)}
.av-move{position:absolute;inset:0;transform:translate3d(var(--mx,0px),var(--my,0px),0) scale(calc(1 + var(--wp,0) * .08));transform-origin:47% 60%;transition:transform .35s ease-out}
.av-body{position:absolute;inset:0;transform-origin:47% 97%;transform:translate(var(--bx,0%),var(--by,0%)) rotate(var(--br,0deg)) scale(var(--bs,1))}
.av-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;display:block}
.av-top{-webkit-mask-image:linear-gradient(#000 38%,transparent 50%);mask-image:linear-gradient(#000 38%,transparent 50%)}
.av-cloak{-webkit-mask-image:linear-gradient(transparent 38%,#000 50%);mask-image:linear-gradient(transparent 38%,#000 50%);filter:url(#av-cloth)}
.av-glow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;pointer-events:none}
.av-eye{width:5%;aspect-ratio:1;background:radial-gradient(circle,#fff2e8 0,#ff3b2f 22%,#ff3b2f66 45%,transparent 70%);animation:av-eye 3.2s ease-in-out infinite}
.av-gem{width:7%;aspect-ratio:1;background:radial-gradient(circle,#c8ffd6 0,#2bff6a88 35%,transparent 70%);animation:av-pulse 2.6s ease-in-out infinite}
.av-hand{width:20%;aspect-ratio:1;background:radial-gradient(circle,#2bff6a40 0,transparent 65%);animation:av-pulse 3.4s ease-in-out infinite}
.av-tip{width:14%;aspect-ratio:1;background:radial-gradient(circle,#f4fff4 0,#7dff9a 16%,#2bff6a55 40%,transparent 70%);transform:translate(-50%,-50%) scale(calc(.75 + var(--charge,0) * 1.6))}
.hero-fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;mix-blend-mode:screen}
.av-defs{position:absolute;width:0;height:0;overflow:hidden}
@keyframes av-eye{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}}
@keyframes av-pulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
.pin.hero .panels.right{right:auto;left:48px;top:128px;bottom:auto;width:min(380px,calc(100% - 48px))}
.pin.hero .intro h1{font-size:clamp(48px,7.6vw,104px);max-width:18ch}
@media (max-width:767px){
  .avatar{top:52px;bottom:auto;height:64vh;right:auto;left:50%;transform:translateX(-50%)}
  .pin.hero .intro{top:auto!important;bottom:260px}
  .pin.hero .intro p{display:none}
}
@media (prefers-reduced-motion:reduce){.av-cloak{filter:none}}

/* moving portrait */
.rcol{display:flex;flex-direction:column;gap:36px;min-width:0}
.mportrait{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.mportrait .frame{width:min(260px,70vw);aspect-ratio:4/5;padding:12px;border-radius:50%/42%;background:conic-gradient(from 200deg,#8a6420,#f3d98d,#9c7326,#f8e3a2,#8a6420);box-shadow:0 18px 40px -10px #2a180e99,inset 0 0 0 2px #6b4a14}
.mportrait .in{width:100%;height:100%;border-radius:50%/42%;overflow:hidden;background:#2a180e}
.mportrait img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.25) saturate(1.05);animation:mp-move 7s ease-in-out infinite}
@keyframes mp-move{0%,100%{transform:scale(1.02) translate(0,0) rotate(0)}30%{transform:scale(1.06) translate(-1.5%,-1%) rotate(-.6deg)}65%{transform:scale(1.04) translate(1.5%,.5%) rotate(.6deg)}}
.mportrait figcaption{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--z600);text-align:center}
.mportrait figcaption i{display:block;font-family:var(--sans);font-size:15px;letter-spacing:0;text-transform:none;color:var(--z500);margin-top:2px}

/* editor */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;border:1px solid var(--accent);background:linear-gradient(#9b1c22,#6d1217);color:#f6dc95;border-radius:999px;padding:11px 18px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:90;background:var(--paper);color:var(--ink);border-left:3px solid var(--ink);display:flex;flex-direction:column;box-shadow:-10px 0 0 #1d355722;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--ink)}
.drawer header h2{margin:0;flex:1;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid #1d355733;flex:none}
.tabs button{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1.5px solid transparent;border-radius:999px;padding:6px 10px;color:var(--z600);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:2px 2px 0 var(--accent)}
.ed{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.ed .help{margin:0;font-size:13px;line-height:1.5;color:var(--z600)}
.ed h4{margin:6px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.box{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:12px;display:grid;gap:10px;box-shadow:3px 3px 0 #1d355722}
.boxbar{display:flex;align-items:center;gap:6px}
.boxbar strong{flex:1;min-width:0;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:30px;height:30px;border:1.5px solid #1d355755;background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.ib:hover{border-color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.f{display:grid;gap:5px}
.f > span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--z600)}
.ed input,.ed textarea{width:100%;font:15px/1.45 var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid #1d355755;border-radius:8px;padding:8px 10px}
.ed textarea{min-height:70px;resize:vertical}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #ff5c2a33}
.btn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.btn.go{background:linear-gradient(#9b1c22,#6d1217);color:#f6dc95;border-color:var(--accent);box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.drawer footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:2px solid var(--ink);font-size:13px;color:var(--z600)}
.drawer footer .grow{flex:1;min-width:140px}
.ph{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .th{width:64px;height:80px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-weight:800}
.ph .th img{width:100%;height:100%;object-fit:cover}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .panel,.panels .panel.on{opacity:1;transform:none}
  .meter i{transform:scaleX(var(--lv))}
}
</style>

function embedImage(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var max=1400,k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);var out=cv.toDataURL('image/webp',0.85);if(out.indexOf('data:image/webp')!==0)out=cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.86);res(out)};im.src=fr.result};fr.readAsDataURL(file)})}
function startEditor(artifact,assets){
 var draft=null,tab=0,drawer=null,timer=null,saving=false;
 var fab=document.createElement('button');fab.type='button';fab.className='fab';fab.textContent='✎ Edit portfolio';document.body.appendChild(fab);
 fab.addEventListener('click',open);
 function open(){
  draft=JSON.parse(JSON.stringify(DATA));
  try{var st=sessionStorage.getItem('vp-draft');if(st&&st!==JSON.stringify(DATA))draft._restorable=JSON.parse(st)}catch(e){}
  fab.hidden=true;drawer=document.createElement('aside');drawer.className='drawer';drawer.setAttribute('aria-label','Edit portfolio');document.body.appendChild(drawer);draw();
 }
 function close(){drawer.remove();drawer=null;draft=null;view=DATA;render(view);fab.hidden=false}
 function clean(d){var c=JSON.parse(JSON.stringify(d));delete c._restorable;return c}
 function preview(){clearTimeout(timer);timer=setTimeout(function(){var y=scrollY;view=clean(draft);render(view);scrollTo(0,y)},200)}
 function field(base,f){
  var path=join(base,f[0]),val=getP(draft,path),h='<label class="f"><span>'+esc(f[2])+'</span>';
  if(f[1]==='area')return h+'<textarea data-path="'+path+'" rows="3">'+esc(val)+'</textarea></label>';
  if(f[1]==='photo'){
   h='<div class="f"><span>'+esc(f[2])+'</span><div class="ph"><div class="th">'+(val?'<img src="'+esc(photoSrc(val))+'" alt="">':esc(initials(draft)))+'</div>';
   h+='<label class="btn">Upload photo<input type="file" accept="image/png,image/jpeg,image/webp" data-photo="'+path+'" hidden></label>'+(val?'<button type="button" class="btn" data-photo-clear="'+path+'">Remove</button>':'');
   return h+'</div></div>';
  }
  return h+'<input type="text" data-path="'+path+'" value="'+esc(val)+'"></label>';
 }
 function draw(){
  var T=SCHEMA[tab],h='<header><h2 class="t-title">Edit the voyage</h2><button type="button" class="ib" data-close aria-label="Close">✕</button></header><div class="tabs" role="tablist">';
  SCHEMA.forEach(function(s,i){h+='<button type="button" role="tab" data-tab="'+i+'" aria-selected="'+(i===tab)+'">'+esc(s.tab)+'</button>'});
  h+='</div><div class="ed">';
  if(draft._restorable)h+='<div class="box"><p class="help">พบฉบับร่างที่ยังไม่ได้บันทึกจากครั้งก่อน</p><div><button type="button" class="btn" data-restore>Restore draft</button></div></div>';
  T.groups.forEach(function(g,gi){
   if(g.help)h+='<p class="help">'+esc(g.help)+'</p>';
   if(!g.list){h+='<div class="box">';g.fields.forEach(function(f){h+=field(g.path,f)});h+='</div>';return}
   var L=getP(draft,g.path)||[];
   L.forEach(function(it,i){var nm=it.title||it.name||it.label||it.value||'';
    h+='<div class="box"><div class="boxbar"><strong>'+esc(g.item)+' '+(i+1)+(nm?' · '+esc(nm):'')+'</strong><button type="button" class="ib" data-mv="'+gi+':'+i+':-1" aria-label="Move up"'+(i?'':' disabled')+'>↑</button><button type="button" class="ib" data-mv="'+gi+':'+i+':1" aria-label="Move down"'+(i<L.length-1?'':' disabled')+'>↓</button><button type="button" class="ib" data-del="'+gi+':'+i+'" aria-label="Delete">✕</button></div>';
    g.fields.forEach(function(f){h+=field(g.path+'.'+i,f)});h+='</div>'});
   h+='<div><button type="button" class="btn" data-add="'+gi+'">+ Add '+esc(g.item)+'</button></div>';
  });
  h+='</div><footer><span class="grow" data-status>หน้าเว็บด้านหลังเปลี่ยนตามทันที กด Save เพื่อให้ทุกคนเห็น</span><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn go" data-save>Save</button></footer>';
  drawer.innerHTML=h;
 }
 document.addEventListener('input',function(e){if(!drawer||!drawer.contains(e.target))return;var p=e.target.getAttribute('data-path');if(p){setP(draft,p,e.target.value);preview()}});
 document.addEventListener('change',function(e){
  if(!drawer||!drawer.contains(e.target)||!e.target.matches('[data-photo]')||!e.target.files[0])return;
  var f=e.target.files[0],st=drawer.querySelector('[data-status]');
  if(f.size>8*1024*1024){st.textContent='รูปใหญ่เกิน 8MB กรุณาย่อรูปก่อน';return}
  st.textContent='กำลังอัปโหลดรูป...';
  var pth=e.target.getAttribute('data-photo');embedImage(f).then(function(url){setP(draft,pth,url);st.textContent='ใส่รูปแล้ว รูปฝังอยู่ในหน้าเว็บ (export ได้)';draw();preview()},function(){st.textContent='อ่านไฟล์รูปไม่สำเร็จ ลองใช้ไฟล์ PNG, JPG หรือ WebP'});
 });
 document.addEventListener('click',function(e){
  if(!drawer||!drawer.contains(e.target))return;var b=e.target.closest('button');if(!b)return;var G=SCHEMA[tab].groups;
  if(b.hasAttribute('data-close')||b.hasAttribute('data-cancel'))return close();
  if(b.hasAttribute('data-tab')){tab=+b.getAttribute('data-tab');draw();return}
  if(b.hasAttribute('data-restore')){draft=draft._restorable;draw();preview();return}
  if(b.hasAttribute('data-photo-clear')){setP(draft,b.getAttribute('data-photo-clear'),'');draw();preview();return}
  if(b.hasAttribute('data-add')){var g=G[+b.getAttribute('data-add')],L=getP(draft,g.path);if(!L){L=[];setP(draft,g.path,L)}L.push(JSON.parse(JSON.stringify(g.blank)));draw();preview();var ed=drawer.querySelector('.ed');ed.scrollTop=ed.scrollHeight;return}
  if(b.hasAttribute('data-del')){var q=b.getAttribute('data-del').split(':');
   if(b.getAttribute('data-sure')){getP(draft,G[+q[0]].path).splice(+q[1],1);draw();preview()}else{b.setAttribute('data-sure','1');b.textContent='?';b.style.borderColor='var(--accent)';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-sure');b.textContent='✕';b.style.borderColor=''}},2500)}return}
  if(b.hasAttribute('data-mv')){var m=b.getAttribute('data-mv').split(':'),A=getP(draft,G[+m[0]].path),i=+m[1],j=i+(+m[2]);if(j<0||j>=A.length)return;var tmp=A[i];A[i]=A[j];A[j]=tmp;draw();preview();return}
  if(b.hasAttribute('data-save'))save(b);
 });
 function save(btn){
  if(saving)return;saving=true;btn.disabled=true;var st=drawer.querySelector('[data-status]');st.textContent='กำลังบันทึก...';
  var next=clean(draft);next.sample=false;
  try{sessionStorage.setItem('vp-draft',JSON.stringify(next))}catch(e){}
  artifact.publish(buildDoc(next)).then(function(){try{sessionStorage.removeItem('vp-draft')}catch(e){}st.textContent='บันทึกแล้ว'},function(err){
   saving=false;btn.disabled=false;var c=err&&err.code;
   st.textContent=c==='conflict'?'มีเวอร์ชันใหม่กว่าถูกบันทึกไปก่อน หน้าจะโหลดใหม่ ฉบับร่างถูกเก็บไว้ให้กู้คืน':(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled')?'บัญชีนี้ไม่มีสิทธิ์บันทึกหน้านี้':c==='too_large'?'ข้อมูลใหญ่เกินไป':c==='rate_limited'?'บันทึกถี่เกินไป รอสักครู่':'บันทึกไม่สำเร็จ ลองอีกครั้ง';
  });
 }
}
(async function(){
 try{
  if(!window.claude||!window.claude.use)return;
  var user=await window.claude.use('user');if(!user||!(await user.canEdit()))return;
  var artifact=await window.claude.use('artifact');if(!artifact)return;
  var assets=null;try{assets=await window.claude.use('assets')}catch(e){}
  try{if(sessionStorage.getItem('vp-draft')===JSON.stringify(DATA))sessionStorage.removeItem('vp-draft')}catch(e){}
  startEditor(artifact,assets);
 }catch(e){}
})();
})();
</script>
